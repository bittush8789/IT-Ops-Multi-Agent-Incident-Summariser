# Kubernetes Secret Template for IT-Ops Multi-Agent Incident Summariser
# DO NOT COMMIT REAL CREDENTIALS.
# Replace placeholder values with Base64-encoded secrets before deploying.
apiVersion: v1
kind: Secret
metadata:
  name: itops-secrets
  namespace: itops-incident-summariser
  labels:
    app.kubernetes.io/name: itops-incident-summariser
type: Opaque
stringData:
  # External PostgreSQL Connection URL with pgvector (e.g., AWS RDS PostgreSQL or Aurora)
  DATABASE_URL: "postgresql+psycopg://dbuser:StrongPassword123@aurora-pgvector.cluster-xyz.us-east-1.rds.amazonaws.com:5432/itops_incident_db"
  # Google Gemini API Key
  GEMINI_API_KEY: "AIzaSy_YOUR_GEMINI_API_KEY_HERE"
  # Optional GitHub Token
  GITHUB_TOKEN: "ghp_YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"
  # Optional Langfuse Secrets
  LANGFUSE_PUBLIC_KEY: "pk-lf-YOUR_PUBLIC_KEY"
  LANGFUSE_SECRET_KEY: "sk-lf-YOUR_SECRET_KEY"

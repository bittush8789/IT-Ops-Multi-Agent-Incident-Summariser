apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itops-incident-summariser-hpa
  namespace: itops-incident-summariser
  labels:
    app.kubernetes.io/name: itops-incident-summariser
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itops-incident-summariser
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

apiVersion: batch/v1
kind: Job
metadata:
  name: itops-db-migration
  namespace: itops-incident-summariser
  labels:
    app.kubernetes.io/name: itops-db-migration
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itops-db-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: alembic-migrator
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/itops-incident-summariser:v0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: itops-config
            - secretRef:
                name: itops-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

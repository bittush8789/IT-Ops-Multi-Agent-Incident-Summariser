apiVersion: v1
kind: ConfigMap
metadata:
  name: itops-config
  namespace: itops-incident-summariser
  labels:
    app.kubernetes.io/name: itops-incident-summariser
data:
  APP_ENV: "production"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  GEMINI_MODEL: "gemini-3.8-flash"
  GEMINI_EMBEDDING_MODEL: "models/text-embedding-004"
  EMBEDDING_DIMENSION: "768"
  GITHUB_REPO: "enterprise-org/payment-gateway"
  GITHUB_USE_MOCK: "false"
  LOG_SOURCE_TYPE: "file"
  LOG_FIXTURE_PATH: "tests/fixtures/incident_logs.json"
  MAX_WORKFLOW_STEPS: "12"
  AGENT_TIMEOUT_SECONDS: "30"
  MAX_RETRIES: "2"
  LANGFUSE_ENABLED: "false"
  LANGFUSE_HOST: "https://cloud.langfuse.com"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "itops-incident-summariser"

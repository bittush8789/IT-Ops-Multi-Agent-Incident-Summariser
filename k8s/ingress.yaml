apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itops-incident-summariser
  namespace: itops-incident-summariser
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/example-placeholder"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: itops-summariser.internal.enterprise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itops-incident-summariser
                port:
                  name: http
